services:
  postgres:
    image: postgres:16-alpine
    container_name: sieg-documentos-fiscais-postgres
    environment:
      POSTGRES_DB: documentos_fiscais
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentos_fiscais"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: sieg-documentos-fiscais-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-sieg}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-sieg}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - dados_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_postgres:
  dados_rabbitmq:
